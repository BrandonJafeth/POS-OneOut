# cargo deny check — cadena de suministro de la parte Rust.
# Correr:  cargo deny check   (y cargo audit)   antes de cada versión que se entregue.

[graph]
# Solo se distribuye para Windows: lo de Linux/macOS (GTK, glib, webkit) no se compila ni se entrega.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
# Ver .cargo/audit.toml para cargo audit, que lee Cargo.lock entero (incluye crates de Linux y
# opcionales que no se compilan). Excepciones con análisis de riesgo en SEGURIDAD.md («Dependencias»).
ignore = [
    # SQLite dentro de SQLCipher (libsqlite3-sys 0.30, que fija sqlx 0.8.6). El arreglo está en
    # libsqlite3-sys ≥ 0.31, solo usable con sqlx 0.9 (cambio mayor): pendiente para una versión futura.
    # Base local cifrada, sin SQL de terceros; bd_leer solo SELECT sobre tablas de una lista blanca.
    "RUSTSEC-2026-0459",
    # chrono sin mantenimiento (aviso informativo, sin falla conocida). Pendiente migrar a time o jiff.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.9
# El propio programa (no se publica en crates.io).
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
