[package]
name = "pos"
version = "0.1.0"
description = "Punto de venta local (librerías y floristerías)"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite (pool + migraciones). sqlx va con la MISMA versión que usa el plugin: así el
# comando sql_lote puede abrir transacciones sobre el pool del plugin.
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite"] }
# Hash de PIN (Argon2id).
argon2 = "0.6.0"
# Cifrado de respaldos (AES-256-GCM).
aes-gcm = "0.11.1"


# Argon2 sin optimizar (modo dev) tarda varios segundos por PIN: se compila optimizado siempre.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Solo en Windows: API del spooler para mandar bytes RAW a la impresora.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }
