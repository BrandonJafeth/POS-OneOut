# cargo audit revisa Cargo.lock completo, también crates que NO se compilan para Windows
# o que son opcionales de otras dependencias. Cada excepción está verificada con:
#   cargo tree -i <crate> --target all     (debe decir "nothing to print")
[advisories]
ignore = [
    # rsa (Marvin): solo lo trae sqlx-mysql, driver opcional de sqlx que este programa no activa
    # (features = ["sqlite", ...]). No está en el árbol compilado.
    "RUSTSEC-2023-0071",
    # proc-macro-error (sin mantenimiento) y glib (unsound): dependencias de GTK para Linux.
    # El programa se compila y entrega solo para Windows.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0429",
]
